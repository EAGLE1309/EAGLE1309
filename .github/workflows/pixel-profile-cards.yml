name: Pixel profile cards

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/profile_cards.py"
      - ".github/workflows/pixel-profile-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render contribution graph and stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/profile_cards.py --user "${{ github.repository_owner }}" --out-dir dist

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git add contrib-graph.svg stats.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update pixel profile cards"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
